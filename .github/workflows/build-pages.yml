name: Build and publish Pages branch

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nanomuse-pages-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build static theme
        env:
          API_BASE: ${{ secrets.API_BASE }}
          TITLE: ${{ secrets.TITLE }}
          BACKGROUND_IMAGE: ${{ secrets.BACKGROUND_IMAGE }}
          CSP_API: ${{ secrets.CSP_API }}
          CSP_STATIC: ${{ secrets.CSP_STATIC }}
        run: npm run build:github-page

      - name: Append build to dist branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          FILES="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "$FILES" != $'assets\nindex.html' ]; then
            echo "Unexpected build output; expected only index.html and assets/"
            printf '%s\n' "$FILES"
            exit 1
          fi

          SOURCE_SUBJECT="$(git log -1 --format=%s "$SOURCE_SHA")"
          git fetch origin dist
          git worktree add /tmp/nanomuse-pages -B dist origin/dist
          find /tmp/nanomuse-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. /tmp/nanomuse-pages/
          cd /tmp/nanomuse-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The built site is unchanged; no dist commit is needed."
            exit 0
          fi
          git commit -m "$SOURCE_SUBJECT"
          git push origin HEAD:refs/heads/dist
