name: Build and publish CFSM theme

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nanomuse-theme-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # This repository is loaded by the CFSM Worker theme proxy.
      # No API_BASE / Worker URL / Pages Secrets are needed: the browser
      # calls the same-origin Worker, which injects site appearance settings.
      - name: Build static theme
        run: npm run build:github-page

      - name: Append build to dist branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -d dist/assets
          FILES="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          if [ "$FILES" != $'assets\nindex.html' ]; then
            echo "Unexpected build output; expected only index.html and assets/"
            printf '%s\n' "$FILES"
            exit 1
          fi

          SOURCE_SUBJECT="$(git log -1 --format=%s "$SOURCE_SHA")"
          git fetch origin dist
          git worktree add /tmp/nanomuse-theme-dist -B dist origin/dist
          find /tmp/nanomuse-theme-dist -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a dist/. /tmp/nanomuse-theme-dist/
          cd /tmp/nanomuse-theme-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # Preserve one dist history commit for every build, even when assets did not change.
          git commit --allow-empty -m "$SOURCE_SUBJECT"
          git push origin HEAD:refs/heads/dist
